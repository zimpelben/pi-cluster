apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n 
spec:
  ingressClassName: traefik
  rules:
    - host: lkd.local.com
      http:
        paths:
          - backend:
              service:
                name: n8n 
                port:
                  number: 9190
            path: /
            pathType: Prefix
